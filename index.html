<!-- AI ANALİZ GİRİŞİ: Bu dosyayı çözülen testleri analiz etmek için okuyan yapay zekâ önce aiAnalysisGuide betiğini okumalıdır; profiller ve cevaplar sessionSeed içindedir. -->
<script id="aiAnalysisGuide" type="text/markdown"># Test Atölyesi — Yapay Zekâ Analiz Yönergesi (v1)

> Bu yönerge, Test Atölyesi uygulamasının ürettiği **analiz paketini** (`format: "test-atolyesi-analysis"`) ya da
> uygulamanın HTML dosyasını inceleyen yapay zekâ ajanı içindir. Uygulama kendisi yapay zekâ değildir; veriyi
> toplar, sen yorumlarsın. Bu metni baştan sona oku, sonra aşağıdaki sırayla çalış.

## 0. Okuma sırası (zorunlu)
1. **Bu yönerge** (`readFirstGuide`; HTML içinde `<script id="aiAnalysisGuide">`).
2. **Kitap kimliği ve muhtevası:** `books[].title/author/year/description` ve özellikle `books[].meta`
   (`purpose` = amaç, `scope` = kapsam, `audience` = hedef kitle, `exam` = hedef sınav, `sectionsOverview` = bölümler).
   Kitabın neyi ölçmek için yazıldığını anlamadan cevap yorumlama.
3. **Test düzeyi:** `tests[].section`, `topic`, `checked`, `result`, `attempts` (önceki kontrollerin tarihleri ve cevapları),
   `elapsedSec`, `limits`.
4. **Soru düzeyi:** her soruda `stem` (soru kökü), `context` (öncüller/bilgi), `passage`, `tables`, `options`,
   `answer` (kitabın anahtarı), `userAnswer`, `result`, `topic`, `concepts`, `level`, `timeSec`, `flaggedForLater`,
   `singleCheck`, `note`, `keyEditedByUser`, `bookExplanation`.
5. HTML'yi doğrudan okuyorsan: `importContract` (veri şeması), `bookData` ve `extraBooks` (kitaplar), `sessionSeed`
   (profiller: `profiles[].state.tests["<kitapId>/<testId>"]` → `answers`, `notes`, `times`, `flags`, `peeks`, `history`).

## 1. Temel ilke: yanlış şık bir bilgidir
Beş şıktan biri doğrudur. Kullanıcının **hangi** yanlış şıkkı seçtiği, neyi bilmediğini ya da neyi neyle
karıştırdığını gösterir. Her şıkkın `diagnosis` alanı bu çıkarımı soru düzeyinde önceden yazar:
- `options[userAnswer].diagnosis` → seçilen yanlış şıkkın işaret ettiği eksik/karışıklık.
- `options[answer].diagnosis` → doğru cevabın gerektirdiği bilgi.
Tanılar bir başlangıç önerisidir; soru metni ve kitap açıklamasıyla (`bookExplanation`) çelişirse kendi muhakemen geçerlidir.
`diagnosis` yoksa (yeni eklenmiş kitap) aynı çıkarımı sen yap.

## 2. Tek tek sorulara değil örüntülere bak
- Kullanıcının kazara kaçırdığı 1–2 soru bir sonuç değildir. Bir konuda **tekrarlanan** yanlışları, **aynı tür
  karışıklığı** gösteren şık seçimlerini ve farklı testlerde yinelenen kavramları ara.
- Gruplama anahtarları: `topic` → `concepts` → `section` → kitap. Her eksiklik iddiası için en az 2–3 kanıt soru göster
  (kitap/test/soru numarası ve seçilen şık). Tek kanıtlı bulguyu "zayıf işaret" diye etiketle.
- Doğru cevaplar da kanıttır: bir konuda tutarlı doğrular güçlü yöndür. Hızlı ve doğru (düşük `timeSec`) = sağlam bilgi;
  çok uzun sürede doğru = kırılgan bilgi olabilir.
- `level` (bilgi / kavrama / uygulama / analiz) dağılımına bak: ezber bilgide mi, uygulamada mı zorlanıyor?

## 3. Bağlam sinyalleri
- **`note`** (kullanıcı notu): o soru bağlamında çok önemlidir. "emin değilim", "tahmin", "karıştırdım", "tekrar bak" gibi
  notlar doğru cevapları da şüpheli kılar; notta yazan kavram eksikliğin kendisi olabilir. Notları özetle ve bulgulara bağla.
- **`singleCheck`**: kullanıcı testi bitirmeden o soruya baktı. `answerAtFirstCheck` ilk cevabıdır; sonradan değiştirilen
  cevap bakılarak düzeltilmiş olabilir. Değerlendirmede ilk cevabı esas al, sonra düzeltildiyse belirt.
- **`flaggedForLater`**: kullanıcı emin olmadığını işaretledi; doğru olsa bile kırılgan bilgi sayılabilir.
- **`result: "boş"`**: bilinmeyen veya zaman yetmeyen soru; süre sınırı (`limits`) ve `timeSec` ile birlikte yorumla.
- **`attempts`**: aynı test birden çok kez kontrol edildiyse gelişimi (ilk deneme → son deneme) göster.
- **`keyEditedByUser`**: kullanıcı cevap anahtarını değiştirdi; anahtarın doğruluğunu kitap açıklamasıyla sına, gerekirse söyle.
- **`keyDoubt`**: kitabın anahtarının açıklamayla çeliştiğine dair hazırlık sırasında düşülmüş not. Bu sorularda kullanıcının
  "yanlış" cevabı aslında doğru olabilir; kanıt olarak kullanmadan önce değerlendir ve raporda belirt.
- `result: "anahtar-yok"` sorular puanlamaya katılmaz.

## 4. Rapor biçimi (Türkçe)
1. **Genel tablo:** kaç test/soru, başarı ve yanlış oranı, kitabın amacına göre genel düzey (1 paragraf).
2. **Güçlü olunan konular:** konu → kanıt → kısa yorum.
3. **Bilgi eksikliği olan konular (öncelik sırasıyla):** her biri için
   - eksik ya da karışan bilgi (somut: "X ile Y'yi karıştırıyor", "Z kuralının istisnasını bilmiyor"),
   - kanıt sorular ve seçilen şıklar,
   - doğru bilginin 1–3 cümlelik özü (kitap açıklamasına dayan; uydurma bilgi ekleme),
   - önerilen çalışma (hangi bölüm/test tekrar edilmeli).
4. **Hata örüntüleri:** dikkat hataları (olumsuz kök "değildir/yanlıştır" atlama), süre baskısı, çeldiriciye kapılma,
   benzer kavram karıştırma vb.
5. **Notlardan çıkanlar.**
6. **Kısa çalışma planı:** önümüzdeki 1–2 hafta için somut tekrar listesi (kitap bölüm/test adlarıyla).
Kesinlik dili kullan: güçlü kanıt / orta / zayıf işaret. Tahmini kesin bilgi gibi sunma.

## 5. Sınırlar
- Doğru cevabı ve kitap açıklamasını esas al; kitapta olmayan fıkhî/tarihî hüküm uydurma. Kitapla çelişen bir
  anahtar görürsen bunu ayrıca "anahtar şüphesi" olarak bildir.
- Kişisel verileri (profil adı, notlar) raporda gereğinden fazla tekrarlama; paketi başka amaçla kullanma.

function resume(){if(state.last&&books.some(b=>b.id===state.last.book&&b.tests.some(t=>t.id===state.last.test)))openTest(state.last.book,state.last.test);else openBook(bookId);}

return `<aside class="sidebar" id="sidebar"><div class="brand"><div class="mark">t.</div><div>Test Atölyesi<small>KENDİ RİTMİNDE ÖĞREN</small></div></div><nav class="side-nav" aria-label="Ana menü"><button class="${view==='library'?'active':''}" data-act="nav" data-view="library"><b>▦</b> Kitaplığım</button><button class="${view==='contents'?'active':''}" data-act="contents"><b>☷</b> İçindekiler</button><button data-act="import"><b>＋</b> Kitap ekle</button><button data-act="cloud"><b>☁</b> Google Drive</button><button data-act="backup"><b>↗</b> Yedek ve taşıma</button><button data-act="profiles"><b>👤</b> Profiller</button><button data-act="analysis"><b>✦</b> YZ analizi</button><button data-act="appearance"><b>⚙</b> Görünüm ayarları</button><button data-act="ttsSettings"><b>🔊</b> Sesli okuma</button><button data-act="htmlFile"><b>↧</b> HTML’ye otomatik kayıt</button><button class="${view==='help'?'active':''}" data-act="nav" data-view="help"><b>?</b> Kullanım ve AI formatı</button></nav>${view==='study'?`<div class="side-book"><div class="eyebrow">KİTABIN İÇİNDE</div><strong>${esc(currentBook.title)}</strong><div class="toc">${toc}</div></div>`:`<div class="side-book"><div class="eyebrow">ÇALIŞMA ALANIN</div><strong>Bir soru daha, bir adım ileri.</strong><p>👤 ${esc(activeProfile().name)} · Kitaplar ortak, çalışma geçmişin profiline kayıtlı.</p></div>`}<div class="side-foot"><span class="status-dot"></span> Çevrimdışı kullanıma hazır<br><span>İnternet veya hesap gerektirmez.</span></div></aside>`;}
function render(){applyAppearance();const labels={library:'Kitaplığım',contents:'İçindekiler',study:currentTest?.title,help:'Kullanım ve AI formatı'};$('#app').innerHTML=`<div class="shell">${sidebar()}<div><header class="topbar"><div class="row"><button class="mobile-menu small" data-act="menu" aria-label="Menüyü aç">☰</button><div class="crumb"><strong>Çalışma alanı</strong><span> / ${esc(labels[view])}</span></div></div><div class="top-right">${profileChip()}<div class="save" id="saveText">${saveLabel()+cloudLabel()}</div></div></header><main>${locked?'<div class="alert">Bu uygulama başka bir sekmede açık. Çakışmayı önlemek için bu sekme salt okunur. <button class="small" data-act="takeover">Burada devam et</button></div>':''}${!storageOK?'<div class="alert">Tarayıcı kayda izin vermedi veya depolama dolu. Çalışmayı sürdürmeden önce yedek indirin ve normal tarayıcı penceresinde açın.</div>':''}${view==='library'?library():view==='contents'?contents():view==='study'?study():help()}</main></div></div>`;updateClocks();ttsRefresh();}
function library(){const st=totalStats();return `<section class="intro"><div><div class="eyebrow">KİŞİSEL TEST KİTAPLIĞIN</div><h1>Her kitap, yeni bir başlangıç.</h1><p>Sorularını çöz, zamanını yönet, kaldığın yerden devam et.<br>Çalışma alanın her adımını hatırlar.</p></div><div class="row"><button data-act="import">＋ Kitap ekle</button>${state.last?'<button class="primary" data-act="resume">Çalışmaya devam et →</button>':''}</div></section><section class="stats" aria-label="Çalışma özeti"><div class="stat"><small>Kitaplığındaki kitap</small><strong>${books.length.toLocaleString('tr')}</strong></div><div class="stat"><small>Toplam soru</small><strong>${allQuestions().toLocaleString('tr')}</strong></div><div class="stat"><small>İşaretlediğin soru</small><strong>${st.answered.toLocaleString('tr')}</strong></div><div class="stat"><small>Toplam çalışma süren</small><strong>${duration(st.time)}</strong></div></section><div class="section-title"><h2>Kitapların</h2><span class="eyebrow">${books.length} KİTAP</span></div>${books.map((b,i)=>{let n=0,a=0;for(const t of b.tests){n+=t.questions.length;const s=state.tests[b.id+'/'+t.id];if(s)a+=Object.keys(s.answers).length;}return `<article class="book-card"><div class="cover" style="${i?'background:#455168':''}"><small>SORU KİTAPLIĞI / ${esc(b.year||'')}</small><strong>${/^DHBT [12] ·/.test(b.title)?'DHBT<br>'+esc(b.title.match(/^DHBT (\d)/)[1]):esc(b.title.slice(0,20))}</strong><span>${esc(b.author||'Kişisel kitaplık')}</span></div><div class="book-content"><span class="tag">${/^rauf-sara-dhbt[12]-2025$/.test(b.id)?'Metin tabanlı kitap':'İçe aktarıldı'}</span><h2>${esc(b.title)}</h2><p>${esc(b.author||'')} ${b.year?'· '+esc(b.year):''}</p><div class="book-meta"><span><b>${b.tests.length}</b> test</span><span><b>${n.toLocaleString('tr')}</b> soru</span><span><b>${new Set(b.tests.map(t=>t.section)).size}</b> bölüm</span></div><div class="bar"><i style="width:${n?a/n*100:0}%"></i></div><p>${a} / ${n} soru işaretlendi</p><div class="row"><button class="primary" data-act="book" data-id="${esc(b.id)}">Kitabı aç →</button>${b.id!==builtin?.id?`<button class="small danger" data-act="removeBook" data-id="${esc(b.id)}">Kitabı kaldır</button>`:''}</div></div></article>`;}).join('')}<div class="note"><strong>Her şey kaldığı yerde.</strong> Cevaplar, notlar ve süreler otomatik kaydedilir. Tarayıcı verilerinin silinmesine karşı “Yedek ve taşıma” bölümünden düzenli yedek alabilirsin.</div>`;}
function contents(){const b=books.find(b=>b.id===bookId)||books[0];if(!b)return library();return `<div class="intro"><div><div class="eyebrow">KİTAP / İÇİNDEKİLER</div><h1>${esc(b.title)}</h1><p>${esc(b.author||'')} · ${b.tests.length} test. Bir konu seç ve çalışmaya başla.</p></div><button data-act="nav" data-view="library">← Kitaplık</button></div><div class="filter"><input id="search" type="search" placeholder="Konu veya test ara…" value="${esc(filter)}" aria-label="Test ara"><select id="sectionFilter" aria-label="Bölüm seç"><option value="">Tüm bölümler</option>${[...new Set(b.tests.map(t=>t.section||'Diğer'))].map(s=>`<option ${s===sectionFilter?'selected':''}>${esc(s)}</option>`).join('')}</select></div>${resultsLegend()}<div class="test-list" id="testList">${testCards(b)}</div>`;}
function testOutcome(t,s){if(!s?.checked)return null;const c=counts(t,s),ratio=c.known?c.wrong/c.known:0;let tone,label;if(c.wrong===0){tone='green';label='Yanlış yok';}else if(c.wrong>=Math.ceil(c.known/2)){tone='red';label='Öncelikli tekrar';}else if(c.wrong<=1){tone='green';label='Çok iyi';}else if(c.wrong<=3){tone='blue';label='İyi';}else if(c.wrong>=Math.max(4,Math.floor(c.known/3))){tone='orange';label='Tekrar gerekli';}else{tone='yellow';label='Gözden geçir';}const perfect=c.known>0&&c.correct===t.questions.length&&c.wrong===0&&c.blank===0&&c.unknown===0;return{...c,tone,label,perfect,wrongPercent:Math.round(ratio*100),successPercent:c.known?Math.round(c.correct/c.known*100):0};}
function resultSummary(r){return `<div class="test-result" aria-label="${r.correct} doğru, ${r.wrong} yanlış, ${r.blank} boş, yüzde ${r.wrongPercent} yanlış"><div class="result-numbers"><span><b>${r.correct}</b> Doğru</span><span><b>${r.wrong}</b> Yanlış</span><span><b>${r.blank}</b> Boş</span></div><div class="result-percent"><strong>%${r.successPercent} başarı</strong><span>%${r.wrongPercent} yanlış</span></div>${r.unknown?`<small>${r.unknown} sorunun anahtarı bekleniyor</small>`:''}</div>`;}
function testCards(b){return b.tests.filter(t=>(!sectionFilter||(t.section||'Diğer')===sectionFilter)&&(!filter||(t.title+' '+t.section).toLocaleLowerCase('tr').includes(filter.toLocaleLowerCase('tr')))).map(t=>{const s=state.tests[b.id+'/'+t.id],n=s?Object.keys(s.answers).length:0,r=testOutcome(t,s);return `<button class="test-card ${r?'result-'+r.tone:''} ${r?.perfect?'perfect-test':''}" data-act="test" data-book="${esc(b.id)}" data-test="${esc(t.id)}">${r?.perfect?'<span class="perfect-sparkles" aria-hidden="true">✦ <span>✧</span> ✨</span>':''}<span class="eyebrow">${esc(t.section||'Testler')}</span><h3>${esc(t.title)}</h3><div class="row"><span class="tag">${t.questions.length} soru</span>${r?`<span class="result-badge">${r.perfect?'✦ Tam doğru':r.label}</span>`:''}</div>${r?resultSummary(r):`<p>${n?'Kaldığın yerden devam et':'Çalışmaya hazır'}</p>`}${s?.elapsed?`<small class="test-duration">Çalışma: ${duration(s.elapsed)}</small>`:''}<div class="bar"><i style="width:${n/t.questions.length*100}%"></i></div><footer><span>${n} / ${t.questions.length} işaretlendi</span><strong>→</strong></footer></button>`;}).join('')||'<div class="empty">Bu aramaya uygun test bulunamadı.</div>';}
function resultsLegend(){return `<div class="results-legend" aria-label="Test sonuç renkleri"><span class="legend-item legend-red">● Yarısı veya fazlası yanlış</span><span class="legend-item legend-orange">● Yaklaşık üçte biri yanlış</span><span class="legend-item legend-yellow">● Yaklaşık dörtte biri yanlış</span><span class="legend-item legend-blue">● 2–3 yanlış</span><span class="legend-item legend-green">● 0–1 yanlış</span><span>✦ Tümü doğru, boş yok</span><small>Renkler son kontrol edilen mevcut cevapları gösterir. Kontrol edilmemiş testler nötrdür. 20 soruda: 10+ kırmızı · 6–9 turuncu · 4–5 sarı · 2–3 mavi · 0–1 yeşil. Diğer uzunluklarda kırmızı yarıdan, turuncu yaklaşık üçte birden başlar; kalan 4+ yanlış sarıdır.</small></div>`;}


function study(){const t=currentTest,s=currentState,q=t.questions[s.index],c=counts(t,s),a=s.answers[q.id],flag=s.flags[q.id],peek=!s.checked&&peekOpen(s,q),revealed=s.checked||peek;let result='';if(s.checked){const pct=c.known?Math.round(c.correct/c.known*100):0;result=`<section class="result-strip"><div><strong>%${pct}</strong><p>Cevap anahtarı olan ${c.known} soruda</p></div><span><b>${c.correct}</b> doğru</span><span><b>${c.wrong}</b> yanlış</span><span><b>${c.blank}</b> boş</span>${c.unknown?`<span>${c.unknown} cevap anahtarı bekliyor</span>`:''}<button class="small" data-act="uncheck">Düzenlemeye dön</button></section>`;}
const options=q.options.map((o,i)=>{const key=typeof o==='string'?String.fromCharCode(65+i):o.id;const text=typeof o==='string'?o:o.text;return `<div class="option-row"><button class="option ${a===key?'selected':''} ${revealed&&q.answer===key?'correct':''} ${revealed&&a===key&&q.answer&&a!==q.answer?'wrong':''}" data-act="answer" data-id="${esc(key)}" aria-pressed="${a===key}" ${revealed||locked?'disabled':''}><b>${esc(key)}</b>${q.image&&text===key?'':`<span dir="auto">${esc(text)}${typeof o==='object'&&o.blocks?`<div class="rich-content">${blocksHTML(o.blocks)}</div>`:''}</span>`}</button>${q.image&&text===key?'':ttsButton(key,key+' şıkkı')}</div>`;}).join('');
return `<div class="study-head"><div><div class="eyebrow">${esc(t.section||currentBook.title)}</div><h2>${esc(t.title)}</h2><p>${c.answered} / ${t.questions.length} işaretli · ${s.checked?'Sonuç incelemesi':'Çalışma oturumu'}</p></div><div class="timer-panel"><div class="clock" id="testClock"></div><button data-act="pause" id="pauseBtn" class="${running?'':'primary'}" ${s.checked||locked?'disabled':''}>${running?'Ⅱ Duraklat':'▶ Devam et'}</button><button class="small" data-act="settings" aria-label="Süre ayarları">⚙ Süre</button></div></div>${result}<div class="workspace"><article class="question"><header class="question-title"><strong>Soru ${s.index+1} <span style="color:var(--muted);font-weight:400">/ ${t.questions.length}</span>${q.topic?`<small class="q-topic">${esc(q.topic)}</small>`:''}</strong><span class="q-title-tools">${q.image?'':ttsButton('q','Soru','Soruyu oku','Soru')+ttsButton('all','Bütün şıklar','Şıkları oku','Şıklar')}<span class="inline-time" id="qClock"></span></span></header><div class="question-body">${!running&&!s.checked?'<div class="alert">Oturum duraklatıldı. Süreyi başlatmak için “Devam et”e bas.</div>':''}${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}${q.image?`<img class="q-image" src="${q.image}" alt="${esc(t.title)} — ${q.number||s.index+1}. sorunun özgün görüntüsü" data-act="zoomQ">`:`<div class="q-text" dir="auto">${esc(q.text)}</div>`}${q.blocks?.length?`<div class="rich-content">${blocksHTML(q.blocks)}</div>`:''}${figuresHTML(q.figures,'question')}<div class="options ${q.image?'answer-row':''}" role="group" aria-label="Cevap seçenekleri">${options}</div>${peek?peekResultHTML(s,q):''}<div class="q-tools">${!s.checked?`<button class="peek-btn ${peek?'active':''}" data-act="peek" ${locked?'disabled':''} title="Testi bitirmeden yalnız bu soruyu kontrol et (K)">${peek?'Kontrolü gizle':a?'✓ Bu soruyu kontrol et':'✓ Cevabı göster'}</button>`:''}<button data-act="clearAnswer" ${revealed||locked?'disabled':''}>Seçimi sil</button><button data-act="flag" ${locked?'disabled':''}>${flag?'◆ İşaretli':'◇ Sonra bak'}</button><button data-act="resetQuestionTime" ${locked?'disabled':''}>Soru süresini sıfırla</button>${s.checked?'<button data-act="solution">'+(showSolution?'Çözümü gizle':'Çözümü göster')+'</button>':''}</div>${revealed&&showSolution?`<section class="solution"><h3>${q.answer?'Doğru cevap: '+esc(q.answer):'Cevap harfi doğrulanamadı'} ${ttsButton('x','Açıklama','Açıklamayı oku','Oku')}</h3>${q.keyDoubt?`<div class="alert key-doubt"><b>⚠ Anahtar şüphesi:</b> ${esc(q.keyDoubt)} Kaynak PDF’yi inceleyip gerekirse “Cevap anahtarını düzelt” ile değiştirebilirsin.</div>`:''}${!q.answer?'<p>Bu sorunun cevap harfi otomatik puanlamaya alınmadı. Kaynak PDF ve kitap açıklamasını inceleyip cevap anahtarını düzeltebilirsin.</p>':''}${q.explanationImage?`<img src="${q.explanationImage}" alt="Kitaptaki çözüm" data-act="zoomSolution">`:(q.explanation||q.explanationBlocks?.length)?`<div class="q-text" dir="auto">${esc(q.explanation||'')}</div><div class="rich-content">${blocksHTML(q.explanationBlocks)}</div>`:'<p>Bu soru için kitapta açıklama bulunmuyor.</p>'}${figuresHTML(q.explanationFigures,'explanation')}<p style="margin-top:15px;margin-bottom:0">${q.sourcePage?'Soru: PDF s. '+q.sourcePage:''}${q.solutionPage?' · Çözüm: PDF s. '+q.solutionPage:''}</p><button class="small" style="margin-top:12px" data-act="editKey">Cevap anahtarını düzelt</button></section>`:''}</div><footer class="q-footer"><button data-act="prev" ${s.index===0?'disabled':''}>← Önceki</button><span class="eyebrow" style="align-self:center">${s.checked?'İNCELEME':'1–5 İLE İŞARETLE'}</span><button class="primary" data-act="${s.index===t.questions.length-1?'check':'next'}">${s.index===t.questions.length-1?'Testi kontrol et ✓':'Sonraki →'}</button></footer></article><aside class="study-aside"><section class="aside-card"><h3>Soru haritası</h3><div class="palette">${t.questions.map((x,i)=>`<button class="${s.answers[x.id]?'answered ':''}${s.flags[x.id]?'flag ':''}${i===s.index?'current ':''}${(s.checked||s.peeks?.[x.id]?.open)&&s.answers[x.id]&&x.answer?(s.answers[x.id]===x.answer?'good':'bad'):''}${s.peeks?.[x.id]?' peeked':''}" data-act="jump" data-index="${i}" aria-label="${i+1}. soru${s.answers[x.id]?', işaretli':''}" ${i===s.index?'aria-current="true"':''}>${i+1}</button>`).join('')}</div><div class="legend">Yeşil: işaretli · Nokta: sonra bak<br>Çerçeve: bulunduğun soru · Alt çizgi: tek başına kontrol edildi</div></section><section class="aside-card"><div class="mini-stats"><div><strong>${c.answered}</strong>İşaretli</div><div><strong>${t.questions.length-c.answered}</strong>Boş</div><div><strong>${Object.values(s.flags).filter(Boolean).length}</strong>Sonra bak</div></div><div class="bar" style="margin-top:16px"><i style="width:${c.answered/t.questions.length*100}%"></i></div><button class="primary" style="width:100%;margin-top:12px" data-act="check">Testi kontrol et</button></section><section class="aside-card"><h3>Bu soruya notun</h3><textarea id="qNote" rows="4" placeholder="Kısa bir hatırlatma…" ${locked?'disabled':''}>${esc(s.notes[q.id]||'')}</textarea><span class="legend">Yazdıkça kaydedilir.</span></section><section class="aside-card"><h3>Oturum araçları</h3><div style="display:grid;gap:7px"><button class="small" data-act="resetTestTime">Test sürelerini sıfırla</button><button class="small" data-act="clearTestAnswers">Tüm seçimleri sil</button><button class="small danger" data-act="resetTest">Testi tamamen sıfırla</button><button class="small" data-act="history">Önceki kontroller (${s.history.length})</button></div></section></aside></div>`;}
function help(){return `<div class="intro"><div><div class="eyebrow">KILAVUZ</div><h1>Kitaptan çalışma alanına.</h1><p>Yeni kitaplarını yapay zekâ ile dönüştür. Ortak format sayesinde aynı uygulamada çalış.</p></div><button class="primary" data-act="prompt">AI yönergesini indir</button></div><div class="help-grid"><article><h3>01 / Kitabını dönüştür</h3><p>Bu HTML dosyasını ve PDF’yi kullandığın yapay zekâya ver. Dosyanın başındaki importContract alanı tüm şemayı ve kuralları içerir. “Test Atölyesi JSON v1” biçiminde bir dosya iste.</p><p>Yapay zekâ kitabın soru, seçenek, doğru cevap ve varsa açıklamalarını aktarır. Tablolar, maddeler ve ortak parçalar yapısal veri olarak saklanır. Soru ve çözümlerde ana yöntem metindir.</p><button data-act="format">Format örneğini indir</button></article><article><h3>02 / Kitaplığına ekle</h3><p>“Kitap ekle” ile JSON dosyasını seç. Biçimi kontrol edilen kitap otomatik olarak kitaplığına kaydedilir.</p><p>Bu yerel uygulama kendi başına bir AI hizmetine bağlanmaz ve ham PDF’yi otomatik çözümlemez. Dönüştürme işlemini seçtiğin yapay zekâ yapar.</p><button data-act="import">＋ Kitap ekle</button></article><article><h3>03 / Süreyi kendin yönet</h3><p>Test süresi ve her soruda geçirdiğin süre ayrı tutulur. “Süre” düğmesinden toplam test veya soru başına sınır belirleyebilirsin. Sınıra gelindiğinde oturum durur.</p><p>Sekme arka plana geçtiğinde oturum otomatik duraklatılır ve kaydedilir. Sekmeyi kapatıp açınca son kaydedilen süreyle duraklatılmış olarak dönersin; kapalı kalınan zaman eklenmez.</p><p>Kısayollar: 1–5 seçenekler, ← → sorular, boşluk duraklat/devam.</p></article><article><h3>04 / Kayıt ve taşınabilirlik</h3><p>HTML dosyasının üzerine otomatik yazmak için sol menüde “HTML’ye otomatik kayıt” bölümünü açın, dosyayı seçin ve tarayıcının yazma iznini verin. Bağlantı kurulduğunda tüm mevcut ilerleme de dosyaya aktarılır. Üstte “HTML kaydı ✓” görünmeden dosya yazımı tamamlanmış sayılmaz.</p><p>Cevaplar ve süreler her saniyede; notlar ve seçimler her değişiklikte tarayıcıya kaydedilir. Dosya bağlantısı kurulmamışsa değişiklikler yalnız tarayıcıda kalır. Dosya yazmayı desteklemeyen tarayıcılarda kaydı içeren HTML indirebilirsiniz.</p><p>“Kaydı içeren HTML indir” tüm kitapların ve mevcut ilerlemenle yeni, tek bir HTML üretir. JSON yedeği ise diğer kopyaya ilerleme taşır. Dosyayı başka tarayıcıda açarsan yedeğini geri yükle.</p><button data-act="backup">Yedek ve taşıma</button></article><article><h3>Kitabın aktarımı hakkında</h3><p>Rauf Şara DHBT 1 kitabının metinleri düzeltilerek aktarılır. Gerekli harita, şema ve tablolar kaynak PDF’den alınan küçük görsellerle korunur. Soru kökü, seçenekler, doğru cevap ve kitaptaki açıklama ayrı alanlarda tutulur. PDF sayfa numaraları kaynak kontrolü için korunur.</p><p>OCR kaynaklı yazım ve dizgi hataları için metin düzeltmeleri uygulanmıştır. Kaynakla karşılaştırılarak yeniden yazılan bölümler ve küçük özgün şekiller bu sürüme eklenmiştir. Okunamayan cevap harfleri “anahtar bekliyor” olarak tutulur; puanlamaya katılmaz. Kaynak PDF’den inceleyebilir, “Cevap anahtarını düzelt” ile doğru harfi kaydedebilirsin.</p></article>${helpExtra()}<article><h3>Görünüm ve okuma ayarları</h3><p>Sol menüdeki “Görünüm ayarları” ile 14–30 px yazı boyutu, yazı tipi, satır aralığı ve açık/beyaz/sepya/koyu tema seçebilirsiniz. Sayfa zemini, kart zemini, metin ve vurgu rengini ayrı değiştirebilirsiniz. Ayarlar anında kaydedilir; yedek ve taşınabilir HTML’ye de eklenir.</p></article><article><h3>Kontrol ve tekrar</h3><p>“Testi kontrol et” tüm seçimlerini değerlendirir. Çözümler ancak kontrolden sonra açılır. Kontrol sonuçları tarihleriyle saklanır.</p><p>“Düzenlemeye dön” ile cevapları değiştirebilir, seçimi silebilir ve yeniden kontrol edebilirsin. Soruya tekrar tıkladığında seçimin kaldırılır.</p></article></div>`;}
function updateClocks(){if(view!=='study')return;const s=currentState,q=currentTest.questions[s.index];const el=$('#testClock'),qe=$('#qClock');if(el)el.innerHTML=`${duration(s.limit?Math.max(0,s.limit-s.elapsed):s.elapsed)}<small>${s.limit?'Kalan test süresi':'Toplam çalışma süresi'}${running?' · sürüyor':' · duraklatıldı'}</small>`;if(qe)qe.textContent='◷ '+duration(s.times[q.id]||0)+(s.qLimit?' / '+duration(s.qLimit):'');}
function pulse(){const now=performance.now(),delta=(now-lastTick)/1000;lastTick=now;if(!running||view!=='study'||locked||!ready)return;const s=currentState,q=currentTest.questions[s.index];let add=delta;if(s.limit)add=Math.min(add,Math.max(0,s.limit-s.elapsed));if(s.qLimit)add=Math.min(add,Math.max(0,s.qLimit-(s.times[q.id]||0)));s.elapsed+=add;s.times[q.id]=(s.times[q.id]||0)+add;if((s.limit&&s.elapsed>=s.limit-.01)||(s.qLimit&&s.times[q.id]>=s.qLimit-.01)){running=false;save();render();toast('Süre sınırına ulaştın. Süre ayarlarını değiştirebilir veya testi kontrol edebilirsin.');}updateClocks();}
function toggleRun(){pulse();if(locked||currentState.checked)return;const s=currentState,q=currentTest.questions[s.index];if(!running&&((s.limit&&s.elapsed>=s.limit)||(s.qLimit&&(s.times[q.id]||0)>=s.qLimit))){toast('Süre sınırına ulaşıldı. Devam etmek için süreyi sıfırla veya sınırı değiştir.');return;}running=!running;lastTick=performance.now();save();render();}
function jump(i){pulse();if(i<0||i>=currentTest.questions.length)return;ttsStop();currentState.index=i;showSolution=false;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function answer(a){if(locked||currentState.checked)return;pulse();const q=currentTest.questions[currentState.index];if(peekOpen(currentState,q)){toast('Bu sorunun kontrolü açık. Cevabı değiştirmek için önce “Kontrolü gizle”ye bas.');return;}if(currentState.answers[q.id]===a)delete currentState.answers[q.id];else currentState.answers[q.id]=a;save();render();}
function dialog(title,body,buttons=''){pulse();running=false;render();$('#modal').innerHTML=`<div class="dialog-back"><section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body}<div class="end"><button data-act="close">Kapat</button>${buttons}</div></section></div>`;$('#modal button')?.focus();}
function closeDialog(){ $('#modal').innerHTML='';lastTick=performance.now();}
function confirmAction(title,body,fn){dialog(title,`<p>${esc(body)}</p>`,'<button class="primary" id="confirmAction">Onayla</button>');$('#confirmAction').onclick=()=>{closeDialog();if(locked)return;fn();save();render();};}
function settings(){const s=currentState;dialog('Süre ayarları',`<p>Süreler yalnız açık oturumda işler. 0 değeri sınırsızdır. Ayar değişikliği mevcut süreleri silmez.</p><label for="limit">Testin toplam süre sınırı (dakika)</label><input id="limit" type="number" min="0" max="10080" step="0.5" value="${s.limit/60}"><label for="qlimit">Her soru için süre sınırı (saniye)</label><input id="qlimit" type="number" min="0" max="86400" step="1" value="${s.qLimit}"><p style="margin-top:15px">Test süresi: ${duration(s.elapsed)}. Bir sınır dolduğunda oturum durur; otomatik cevap değiştirilmez.</p>`,'<button class="primary" id="saveSettings">Ayarları kaydet</button>');$('#saveSettings').onclick=()=>{const l=Number($('#limit').value),q=Number($('#qlimit').value);if(!Number.isFinite(l)||l<0||l>10080||!Number.isFinite(q)||q<0||q>86400){toast('Geçerli bir süre gir.');return;}s.limit=l*60;s.qLimit=Math.floor(q);save();closeDialog();render();};}
function check(){if(locked)return;confirmAction('Testi kontrol et',`${counts(currentTest,currentState).answered} / ${currentTest.questions.length} soru işaretledin. Cevaplar değerlendirilecek ve kitap çözümleri açılacak.`,()=>{running=false;currentState.checked=true;const result=counts(currentTest,currentState);currentState.history.push({at:new Date().toISOString(),...result,elapsed:currentState.elapsed,answers:{...currentState.answers}});showSolution=true;});}
function download(name,data,type='application/json'){if(host&&typeof host.exportFile==='function'){try{host.exportFile(name,type,data);return;}catch(e){}}const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function backupDialog(){dialog('Yedek ve taşıma','<p>JSON yedeği: tüm ilerlemen, notların, cevap anahtarı düzeltmelerin ve eklediğin kitaplar. Yerleşik DHBT kitabı uygulamada zaten bulunur.</p><p>Taşınabilir HTML: yerleşik kitap ve eklediğin kitaplar dahil, mevcut kayıtlarını içeren tek dosya. Dosya büyük olabilir.</p><p>Doğrudan dosyaya kayıt: “HTML’ye otomatik kayıt” bölümünden HTML dosyanızı seçip bağlayın. Bağlandıktan sonra her işaretleme ve süre değişikliği dosyanın içine yazılır. Üst çubukta dosya kaydının tamamlandığını görebilirsiniz.</p><button data-act="htmlFile">HTML’ye otomatik kayıt</button><div class="row"><button class="primary" data-act="exportBackup">JSON yedeği indir</button><button data-act="restore">Yedekten geri yükle</button><button data-act="portable">Kaydı içeren HTML indir</button></div>');}
const sample={format:'test-atolyesi',version:1,books:[{id:'kitap-kimligi',title:'Kitabın adı',author:'Yazar',year:2026,contentVersion:1,meta:{purpose:'Kitabın amacı',scope:'Kapsadığı konular',audience:'Hedef kitle',exam:'Hedef sınav',sectionsOverview:'Bölümlerin kısa özeti'},tests:[{id:'test-01',title:'Bölüm 1 · Test 1',section:'Bölüm 1',topic:'Testin konusu',questions:[{id:'q1',number:1,text:'I. Birinci öncül\nII. İkinci öncül\nYukarıdakilerden hangileri doğrudur?',stem:'Yukarıdakilerden hangileri doğrudur?',context:'I. Birinci öncül\nII. İkinci öncül',stemFirst:true,topic:'Konu — alt konu',concepts:['ölçülen kavram'],level:'kavrama',options:[{id:'A',text:'Yalnız I',diagnosis:'II. öncüldeki bilgiyi yanlış biliyor.'},{id:'B',text:'I ve II',diagnosis:'Doğru: iki öncülün de doğru olduğunu biliyor.'},{id:'C',text:'Yalnız II',diagnosis:'I. öncüldeki kuralı bilmiyor.'},{id:'D',text:'Hiçbiri',diagnosis:'Konunun temel kurallarını tanımıyor.'},{id:'E',text:'Belirlenemez',diagnosis:'Öncülleri değerlendirmeden kaçınıyor; konuyu tanımıyor olabilir.'}],answer:'B',explanation:'Yalnız kitapta açıklama varsa aktarılır.',sourcePage:1,solutionPage:2}]}]}]};
const prompt='TEST ATÖLYESİ — KİTAP DÖNÜŞTÜRME v1\n\nBu HTML ve kaynak kitabı birlikte incele. Aşağıdaki sözleşmeye uygun UTF-8 JSON üret. Soruları, seçenekleri ve açıklamaları metin olarak aktar. OCR hatalarını bağlam ve kaynakla karşılaştırarak düzelt; anlamı veya doğru cevabı değiştirme. Gerekli şekilleri küçük figures/explanationFigures öğeleri olarak koru. Sesli okuma için her sorunun kökünü (stem) ve bilgi kısmını (context) ayrı yaz; YZ analizi için konu (topic), kavramlar (concepts), düzey (level) ve her şıkkın tanısını (options[].diagnosis) ekle; kitabın amacını ve kapsamını meta alanına yaz.\n\n'+JSON.stringify(JSON.parse(document.querySelector('#importContract').textContent),null,2)+'\n\nÖrnek:\n'+JSON.stringify(sample,null,2);
function validateBlocks(bs){if(bs==null)return;if(!Array.isArray(bs))throw Error('blocks bir dizi olmalı.');for(const b of bs){if(!b||!['text','table','list','pre'].includes(b.type))throw Error('İçerik bloğu türü geçersiz.');if(['text','pre'].includes(b.type)&&typeof b.text!=='string')throw Error('Blok metni eksik.');if(b.type==='table'&&(!Array.isArray(b.rows)||b.rows.some(r=>!Array.isArray(r)||r.some(x=>typeof x!=='string'))||(b.headers&&(!Array.isArray(b.headers)||b.headers.some(x=>typeof x!=='string')))))throw Error('Tablo satırları düz metin hücrelerinden oluşmalı.');if(b.type==='list'&&(!Array.isArray(b.items)||b.items.some(x=>typeof x!=='string')))throw Error('Liste maddeleri düz metin olmalı.');}}
function validateFigures(figures){if(figures==null)return;if(!Array.isArray(figures)||figures.length>30)throw Error('Görsel listesi geçersiz.');for(const f of figures){if(!f||!validImage(f.src)||(f.alt!=null&&typeof f.alt!=='string')||(f.caption!=null&&typeof f.caption!=='string'))throw Error('Şekiller PNG, JPEG veya WebP veri adresi ve metin açıklamasından oluşmalı.');}}
function figuresHTML(figures,kind){return (figures||[]).map((f,i)=>`<figure class="book-figure"><button class="figure-zoom" data-act="figure" data-kind="${kind}" data-index="${i}" aria-label="${esc((f.alt||'Kitaptaki şekil')+' · Büyüt')}"><img src="${f.src}" alt="${esc(f.alt||'Kitaptaki şekil')}" loading="lazy"></button>${f.caption?`<figcaption>${esc(f.caption)} · Büyütmek için tıkla</figcaption>`:''}</figure>`).join('');}
function validImage(x){return typeof x==='string'&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=\r\n]+$/.test(x);}
function validateBook(b){if(!b||typeof b.id!=='string'||!b.id.trim()||b.id.length>150||/[\/]/.test(b.id)||['__proto__','constructor','prototype'].includes(b.id)||typeof b.title!=='string'||!b.title.trim()||!Array.isArray(b.tests)||!b.tests.length)throw Error('Kitap kimliği, adı ve testler zorunlu.');const testIds=new Set();for(const t of b.tests){if(!t||typeof t.id!=='string'||!t.id.trim()||testIds.has(t.id)||/[\/]/.test(t.id)||['__proto__','constructor','prototype'].includes(t.id)||typeof t.title!=='string'||!Array.isArray(t.questions)||!t.questions.length)throw Error('Test kimlikleri tekil, test adı ve sorular dolu olmalı.');testIds.add(t.id);const ids=new Set();for(const q of t.questions){if(!q||typeof q.id!=='string'||!q.id.trim()||ids.has(q.id)||['__proto__','constructor','prototype'].includes(q.id))throw Error(t.title+': soru kimlikleri tekil olmalı.');ids.add(q.id);if(!q.text&&!q.image&&!q.blocks?.length)throw Error(t.title+': soru metni veya görüntüsü eksik.');for(const k of ['text','passage','explanation'])if(q[k]!=null&&typeof q[k]!=='string')throw Error(k+' düz metin olmalı.');validateFigures(q.figures);validateFigures(q.explanationFigures);for(const k of ['image','explanationImage'])if(q[k]&&!validImage(q[k]))throw Error('Görseller PNG, JPEG veya WebP base64 olmalı.');if(!Array.isArray(q.options)||q.options.length<2||q.options.length>8)throw Error('Her soruda 2–8 seçenek olmalı.');const keys=q.options.map((o,i)=>typeof o==='string'?String.fromCharCode(65+i):o?.id);if(keys.some((k,i)=>k!==String.fromCharCode(65+i))||q.options.some(o=>typeof o!=='string'&&typeof o?.text!=='string'))throw Error('Seçenekler A’dan başlayarak sırayla tanımlanmalı.');for(const blocks of [q.blocks,q.explanationBlocks,...q.options.filter(o=>typeof o==='object').map(o=>o.blocks)])validateBlocks(blocks);if(q.answer!=null&&!keys.includes(q.answer))throw Error('Doğru cevap seçenekler arasında yok.');}}return b;}
function idb(action,key,value){return new Promise((resolve,reject)=>{if(!db){reject(Error('Kitap deposu açılamadı.'));return;}const tr=db.transaction('books',action==='get'?'readonly':'readwrite'),os=tr.objectStore('books');let req=action==='get'?os.getAll():action==='delete'?os.delete(key):os.put(value);tr.oncomplete=()=>resolve(req.result);tr.onerror=()=>reject(tr.error);tr.onabort=()=>reject(tr.error||Error('Kayıt iptal edildi'));});}
const originalKeys=new WeakMap();
function rememberKey(q){if(!originalKeys.has(q))originalKeys.set(q,q.answer??null);}
// Key fixes are personal: restore the book key first so switching profiles never leaks another profile's override.
function applyKeyOverrides(){for(const b of books)for(const t of b.tests){const keys=state.tests[b.id+'/'+t.id]?.keyOverrides||{};for(const q of t.questions){rememberKey(q);q.answer=Object.hasOwn(keys,q.id)?keys[q.id]:originalKeys.get(q);}}}
async function init(){try{db=await new Promise((resolve,reject)=>{const req=indexedDB.open('test-atolyesi-books-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('books',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});imported=await idb('get');for(const b of imported)validateBook(b);books=[...baseBooks(),...imported.filter(b=>b.id!==builtin?.id)];}catch(e){toast('Ek kitap deposu açılamadı. Yerleşik kitap kullanılabilir.');}const embedded=JSON.parse($('#extraBooks')?.textContent||'[]');if(embedded.length){for(const b of embedded){try{validateBook(b);const existing=books.find(x=>x.id===b.id);if(!existing){books.push(b);imported.push(b);if(!locked)await idb('put',b.id,b);}else if(b.contentVersion&&Number(b.contentVersion)>=Number(existing.contentVersion||0)&&JSON.stringify(b)!==JSON.stringify(existing)){books=books.map(x=>x.id===b.id?b:x);imported=imported.map(x=>x.id===b.id?b:x);if(!locked)await idb('put',b.id,b);}}catch(e){toast(e.message);}}}applyKeyOverrides();ready=true;render();await restoreHTMLFile();if(!locked)save();}
async function importFile(file){if(locked)return;if(file.size>250*1024*1024){toast('Dosya 250 MB sınırını aşıyor.');return;}try{const data=JSON.parse(await file.text());if(inputMode==='backup'){const incomingStore=data.version===2?normalizeStore(data.store):null;if(data.format!=='test-atolyesi-backup'||!Array.isArray(data.books)||(data.version===1?!validProfileState(data.state):!incomingStore))throw Error('Bu dosya geçerli bir Test Atölyesi yedeği değil.');const newBooks=data.books.map(validateBook);if(newBooks.some(b=>b.id===builtin?.id)||new Set(newBooks.map(b=>b.id)).size!==newBooks.length)throw Error('Yedekte ek kitap kimlikleri geçersiz.');if(incomingStore)for(const pr of incomingStore.profiles)validateState(pr.state,newBooks);else validateState(data.state,newBooks);confirmAction('Yedeği geri yükle',incomingStore?'Bu dosyadaki tüm profiller ('+incomingStore.profiles.map(x=>x.name).join(', ')+') mevcut profillerin yerine geçecek. Mevcut ek kitaplar korunur. Önce JSON yedeği alabilirsin.':'Eski biçimli (tek kişilik) yedek, etkin profilin ('+activeProfile().name+') ilerlemesinin yerine geçecek. Mevcut ek kitaplar korunur.',async()=>{try{for(const b of newBooks){await idb('put',b.id,b);imported=imported.filter(x=>x.id!==b.id);imported.push(b);}if(incomingStore){store=incomingStore;state=activeProfile().state;}else{state=data.state;activeProfile().state=state;}lastLocalSnapshot='';books=[...baseBooks(),...imported];applyKeyOverrides();view='library';save();render();toast('Yedek geri yüklendi.');}catch(e){toast('Geri yükleme tamamlanamadı: '+e.message);}});return;}if(data.format!=='test-atolyesi'||data.version!==1||!Array.isArray(data.books)||!data.books.length)throw Error('Test Atölyesi JSON v1 biçiminde bir kitap dosyası seç.');const incoming=data.books.map(validateBook);if(new Set(incoming.map(b=>b.id)).size!==incoming.length)throw Error('Dosyadaki kitap kimlikleri tekil olmalı.');if(incoming.some(b=>b.id===builtin?.id))throw Error('Yerleşik kitabın kimliği yeni bir kitapta kullanılamaz.');const clashes=incoming.filter(b=>books.some(x=>x.id===b.id));const proceed=async()=>{try{for(const b of incoming){await idb('put',b.id,b);for(const k of Object.keys(state.tests))if(k.startsWith(b.id+'/'))delete state.tests[k];imported=imported.filter(x=>x.id!==b.id);imported.push(b);}books=[...baseBooks(),...imported];bookId=incoming[0].id;if(window.cloudBooksChanged)cloudBooksChanged(incoming);save();closeDialog();view='contents';render();toast(incoming.length+' kitap eklendi.');}catch(e){toast('Kitap kaydedilemedi: '+e.message);}};if(clashes.length)confirmAction('Aynı kimlikte kitap var','Bu kitaplar değiştirilecek ve bu kitaplardaki ilerleme sıfırlanacak: '+clashes.map(b=>b.title).join(', '),proceed);else await proceed();}catch(e){toast('Dosya alınamadı: '+e.message);}}
function validateState(st,extra){const map=new Map([builtin,...imported,...extra].map(b=>[b.id,b]));if(st.last&&(typeof st.last.book!=='string'||typeof st.last.test!=='string'))throw Error('Yedekte son oturum geçersiz.');for(const [key,s]of Object.entries(st.tests)){if(!s||!Number.isFinite(s.elapsed)||s.elapsed<0||!Number.isFinite(s.limit)||s.limit<0||!Number.isFinite(s.qLimit)||s.qLimit<0||!Number.isInteger(s.index)||s.index<0)throw Error('Yedekte süre veya soru konumu geçersiz.');for(const f of ['answers','times','flags','notes'])if(!s[f]||typeof s[f]!=='object'||Array.isArray(s[f]))throw Error('Yedekte '+f+' geçersiz.');if(s.history&&(!Array.isArray(s.history)||s.history.some(h=>!h||!['correct','wrong','blank','elapsed'].every(k=>Number.isFinite(h[k])&&h[k]>=0)||typeof h.at!=='string')))throw Error('Yedekte kontrol geçmişi geçersiz.');if(Object.values(s.answers).some(x=>typeof x!=='string'||!/^([A-H])$/.test(x)))throw Error('Yedekte seçenek geçersiz.');if(Object.values(s.times).some(x=>!Number.isFinite(x)||x<0)||Object.values(s.notes).some(x=>typeof x!=='string'))throw Error('Yedekte soru kaydı geçersiz.');}}

// ── Soru kökü / bağlam ayrımı (TTS ve YZ analizi) ────────────────────────────
// Zenginleştirilmiş kitaplarda q.stem/q.context hazırdır; eski kitaplarda son soru cümlesi kök sayılır.
const STEM_HINT=/\?|hangi|nedir|kaçtır|değildir|yanlıştır|doğrudur|aşağıdakiler|yukarıdaki|buna göre|verilenler/i;
function splitStem(q){const text=String(q.text||'').trim();if(typeof q.stem==='string'&&q.stem.trim()){const context=typeof q.context==='string'?q.context.trim():'';return{stem:q.stem.trim(),context,stemFirst:typeof q.stemFirst==='boolean'?q.stemFirst:context.length>140};}const i=text.lastIndexOf('\n');if(i>0){const tail=text.slice(i+1).trim();if(STEM_HINT.test(tail)&&tail.length<400){const context=text.slice(0,i).trim();return{stem:tail,context,stemFirst:context.length>140};}}const m=text.match(/^([\s\S]*[.!:;])\s+([^.!:;]*\?)\s*$/);if(m&&m[1].length>60)return{stem:m[2].trim(),context:m[1].trim(),stemFirst:m[1].length>140};return{stem:text,context:'',stemFirst:false};}
function blocksSpeech(blocks){return (blocks||[]).map(b=>b.type==='table'?[(b.headers||[]).join(', '),...(b.rows||[]).map(r=>r.join(', '))].filter(Boolean).join('. '):b.type==='list'?(b.items||[]).map((x,i)=>(i+1)+'. '+x).join('. '):b.text||'').filter(Boolean).join('. ');}
function optionText(o){return typeof o==='string'?o:[o.text,blocksSpeech(o.blocks)].filter(Boolean).join('. ');}
function optionKey(o,i){return typeof o==='string'?String.fromCharCode(65+i):o.id;}

// ── Sesli okuma (cihazın yerleşik TTS motoru) ────────────────────────────────
// Tarayıcıda speechSynthesis; Android sarmalayıcıda window.AndroidHost köprüsü (docs/ANDROID_KOPRU.md).
// Metin cümle parçalarına bölünür; duraklatma = durdur + kalınan parçadan sürdür (Android'de de çalışır).
const ARABIC_CHAR=/[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/;
const ARABIC_RUN=/([؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿][؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿\s،؛؟.:!()«»"'\-]*)/u;
const ttsHost=window.AndroidHost&&typeof window.AndroidHost.ttsSpeak==='function'?window.AndroidHost:null;
let tts={key:null,chunks:[],index:0,status:'idle',uid:0},ttsUtterance=null,ttsHostDone=null;
window.__hostTtsEvent=(uid,ev)=>{if(uid==='u'+tts.uid&&(ev==='done'||ev==='error')&&ttsHostDone)ttsHostDone();};
const ttsSupported=()=>!!ttsHost||('speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function');
function ttsSettings(){const t=state.tts&&typeof state.tts==='object'?state.tts:{};const num=(v,d,a,b)=>Number.isFinite(Number(v))?Math.min(b,Math.max(a,Number(v))):d;return{voice:typeof t.voice==='string'?t.voice:'',arabicVoice:typeof t.arabicVoice==='string'?t.arabicVoice:'',rate:num(t.rate,1,.5,2),pitch:num(t.pitch,1,.5,1.5),announce:t.announce!==false,arabic:['voice','name','skip'].includes(t.arabic)?t.arabic:'voice'};}
function ttsVoices(){if(ttsHost){try{return JSON.parse(ttsHost.ttsVoices()||'[]').map(v=>({id:String(v.id),name:String(v.name||v.id),lang:String(v.lang||'')}));}catch(e){return[];}}return('speechSynthesis' in window?speechSynthesis.getVoices():[]).map(v=>({id:v.voiceURI||v.name,name:v.name,lang:v.lang||'',native:v,local:v.localService}));}
function pickVoice(lang,preferred){const vs=ttsVoices();return vs.find(v=>v.id===preferred&&v.lang.toLowerCase().startsWith(lang))||(preferred&&lang==='tr'?vs.find(v=>v.id===preferred):null)||vs.find(v=>v.lang.toLowerCase().startsWith(lang)&&v.local)||vs.find(v=>v.lang.toLowerCase().startsWith(lang))||null;}
function speechClean(t){return String(t||'').replace(/(\p{L})-\s*\n\s*(\p{L})/gu,'$1$2').replace(/^\s*(IV|V|I{1,3})\s*[.)]\s*/gm,(m,r)=>({I:'1',II:'2',III:'3',IV:'4',V:'5'}[r])+'. ').replace(/(^|[\s,(\-–])(IV|V|I{1,3})(?=$|[\s,.;:?)\-–])/gm,(m,sp,r)=>sp+{I:'1',II:'2',III:'3',IV:'4',V:'5'}[r]).replace(/_{3,}|\.{4,}|…{2,}/g,' boşluk ').replace(/\s*\n\s*/g,' ').replace(/\s{2,}/g,' ').trim();}
function speechChunks(text){const out=[];for(const part of speechClean(text).split(ARABIC_RUN)){const p=part.trim();if(!p||!/[\p{L}\p{N}]/u.test(p))continue;const lang=ARABIC_CHAR.test(p)?'ar':'tr';if(lang==='ar'){out.push({text:p,lang});continue;}let buf='';for(const piece of p.match(/[^.!?;]+[.!?;]*\s*/g)||[p]){if(buf&&(buf+piece).length>220){out.push({text:buf.trim(),lang});buf='';}buf+=piece;while(buf.length>300){const cut=Math.max(buf.lastIndexOf(', ',260),buf.lastIndexOf(' ',260));out.push({text:buf.slice(0,cut>80?cut:260).trim(),lang});buf=buf.slice(cut>80?cut:260);}}if(buf.trim())out.push({text:buf.trim(),lang});}return out;}
function speechForQuestion(q,n){const cfg=ttsSettings(),st=splitStem(q),info=[q.passage,st.context,blocksSpeech(q.blocks),...(q.figures||[]).map(f=>f.alt?'Şekil: '+f.alt:'')].filter(Boolean);const lead=cfg.announce?'Soru '+n+'. ':'';if(st.stemFirst&&info.length)return speechChunks(lead+st.stem).concat(speechChunks((cfg.announce?'Soruya ait bilgiler. ':'')+info.join('. ')));return speechChunks(lead+[q.passage,st.context,st.stem,blocksSpeech(q.blocks)].filter(Boolean).join('. '));}
function speechForOption(o,i){const k=optionKey(o,i);return speechChunks((ttsSettings().announce?k+' şıkkı. ':'')+optionText(o));}
function speechForAllOptions(q){return q.options.flatMap((o,i)=>speechForOption(o,i));}
function speechForSolution(q){return speechChunks([q.answer?'Doğru cevap '+q.answer+'.':'',q.explanation,blocksSpeech(q.explanationBlocks)].filter(Boolean).join(' '));}
function ttsCancelEngine(){try{if(ttsHost)ttsHost.ttsStop();else if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}}
function ttsStop(){if(tts.status==='idle'&&!tts.key)return;tts={key:null,chunks:[],index:0,status:'idle',uid:tts.uid+1};ttsHostDone=null;ttsCancelEngine();ttsRefresh();}
function ttsPause(){tts.status='paused';tts.uid++;ttsHostDone=null;ttsCancelEngine();ttsRefresh();}
function ttsToggle(key,build){if(!ttsSupported()){toast('Bu cihazda/tarayıcıda yerleşik sesli okuma bulunamadı.');return;}if(tts.key===key&&tts.status==='playing'){ttsPause();return;}if(tts.key===key&&tts.status==='paused'){tts.status='playing';ttsRefresh();ttsNext();return;}ttsStop();const chunks=build();if(!chunks.length){toast('Okunacak metin bulunamadı.');return;}tts={key,chunks,index:0,status:'playing',uid:tts.uid+1};ttsRefresh();ttsNext();}
function ttsNext(){const my=++tts.uid;if(tts.status!=='playing')return;if(tts.index>=tts.chunks.length){tts={key:null,chunks:[],index:0,status:'idle',uid:tts.uid};ttsRefresh();return;}const c=tts.chunks[tts.index],cfg=ttsSettings();let text=c.text,lang=c.lang,voice=null;if(lang==='ar'){if(cfg.arabic==='skip'){tts.index++;ttsNext();return;}voice=cfg.arabic==='voice'?pickVoice('ar',cfg.arabicVoice):null;if(!voice){text='Arapça ifade.';lang='tr';}}if(lang==='tr')voice=pickVoice('tr',cfg.voice);const done=()=>{if(my!==tts.uid||tts.status!=='playing')return;tts.index++;ttsNext();};if(ttsHost){ttsHostDone=done;try{ttsHost.ttsSpeak('u'+my,text,lang==='ar'?'ar':'tr-TR',voice?.id||'',cfg.rate);}catch(e){ttsStop();toast('Cihazın sesli okuma motoru yanıt vermedi.');}return;}const u=new SpeechSynthesisUtterance(text);u.lang=voice?.lang||(lang==='ar'?'ar-SA':'tr-TR');if(voice?.native)u.voice=voice.native;u.rate=cfg.rate;u.pitch=cfg.pitch;u.onend=done;u.onerror=e=>{if(e.error==='interrupted'||e.error==='canceled')return;done();};ttsUtterance=u;speechSynthesis.speak(u);}
function ttsPrefix(){return view==='study'&&currentTest?currentBook.id+'/'+currentTest.id+'/'+currentTest.questions[currentState.index].id+':':'';}
function ttsRefresh(){const prefix=ttsPrefix();for(const el of document.querySelectorAll('[data-tts]')){const on=tts.key===prefix+el.dataset.tts,st=on?tts.status:'idle';el.classList.toggle('tts-playing',st==='playing');el.classList.toggle('tts-paused',st==='paused');el.querySelector('i').textContent=st==='playing'?'❚❚':st==='paused'?'▶':'🔊';el.setAttribute('aria-pressed',String(st==='playing'));el.title=(st==='playing'?'Duraklat · ':st==='paused'?'Sürdür · ':'Sesli oku · ')+el.dataset.label;}}
function ttsButton(part,label,text='',short=''){return `<button class="tts-btn" type="button" data-act="tts" data-tts="${esc(part)}" data-label="${esc(label)}" aria-label="${esc(label)} — sesli oku" title="Sesli oku · ${esc(label)}"><i aria-hidden="true">🔊</i>${text?`<span class="tts-long">${esc(text)}</span>`:''}${short?`<span class="tts-short">${esc(short)}</span>`:''}</button>`;}
function ttsRun(part){const q=currentTest.questions[currentState.index],key=ttsPrefix()+part;if(part==='q')ttsToggle(key,()=>speechForQuestion(q,currentState.index+1));else if(part==='all')ttsToggle(key,()=>speechForAllOptions(q));else if(part==='x')ttsToggle(key,()=>speechForSolution(q));else{const i=q.options.findIndex((o,j)=>optionKey(o,j)===part);if(i>=0)ttsToggle(key,()=>speechForOption(q.options[i],i));}}
function voiceOptions(lang,selected){const vs=ttsVoices(),match=vs.filter(v=>v.lang.toLowerCase().startsWith(lang)),rest=lang==='tr'?vs.filter(v=>!v.lang.toLowerCase().startsWith(lang)):[];const opt=v=>`<option value="${esc(v.id)}" ${v.id===selected?'selected':''}>${esc(v.name)} · ${esc(v.lang)}${v.local===false?' · çevrimiçi':''}</option>`;return `<option value="">Otomatik (${lang==='tr'?'Türkçe':'Arapça'} ses varsa)</option>${match.length?`<optgroup label="${lang==='tr'?'Türkçe sesler':'Arapça sesler'}">${match.map(opt).join('')}</optgroup>`:''}${rest.length?`<optgroup label="Diğer diller">${rest.map(opt).join('')}</optgroup>`:''}`;}
function ttsDialog(){const c=ttsSettings(),vs=ttsVoices(),hasTr=vs.some(v=>v.lang.toLowerCase().startsWith('tr')),hasAr=vs.some(v=>v.lang.toLowerCase().startsWith('ar'));dialog('Sesli okuma ayarları',`${ttsSupported()?'':'<div class="alert">Bu tarayıcı yerleşik sesli okumayı desteklemiyor. Güncel Chrome, Edge veya Safari deneyin; Android uygulamasında cihaz sesi kullanılır.</div>'}<p>Okuma, cihazının yerleşik metin okuma (TTS) motoruyla yapılır; internet gerekmez (bazı “çevrimiçi” sesler hariç). Soru düğmesi önce soru kökünü, sonra soruya ait bilgileri okur. Her şıkkın kendi düğmesi vardır. Okurken düğmeye yeniden basmak duraklatır, bir daha basmak kaldığı yerden sürdürür.</p>${vs.length&&!hasTr?'<div class="alert">Cihazında Türkçe ses bulunamadı. İşletim sisteminin dil/konuşma ayarlarından Türkçe ses paketi ekleyebilirsin.</div>':''}<label for="ttsVoice">Ses</label><select id="ttsVoice">${voiceOptions('tr',c.voice)}</select><label for="ttsRate">Okuma hızı: <output id="ttsRateValue">${c.rate.toFixed(2)}×</output></label><input id="ttsRate" type="range" min="0.5" max="2" step="0.05" value="${c.rate}"><label for="ttsPitch">Ses tonu: <output id="ttsPitchValue">${c.pitch.toFixed(2)}</output></label><input id="ttsPitch" type="range" min="0.5" max="1.5" step="0.05" value="${c.pitch}" ${ttsHost?'disabled':''}><label for="ttsArabic">Arapça ifadeler</label><select id="ttsArabic"><option value="voice" ${c.arabic==='voice'?'selected':''}>Arapça sesle oku (yoksa “Arapça ifade” de)</option><option value="name" ${c.arabic==='name'?'selected':''}>Yalnız “Arapça ifade” de</option><option value="skip" ${c.arabic==='skip'?'selected':''}>Atla</option></select>${hasAr?`<label for="ttsArabicVoice">Arapça ses</label><select id="ttsArabicVoice">${voiceOptions('ar',c.arabicVoice)}</select>`:''}<label class="check-row"><input id="ttsAnnounce" type="checkbox" ${c.announce?'checked':''}> Okumaya “Soru 5.”, “A şıkkı.” gibi başlık ekle</label><div class="row"><button data-act="ttsTest">🔊 Sesi dene</button></div><p class="file-help">${vs.length} ses bulundu. Sesler ilk açılışta geç yüklenebilir; liste boşsa pencereyi kapatıp yeniden aç. Kısayol: soru ekranında <b>R</b> soruyu okur/duraklatır.</p>`);}
function ttsInput(e){const t={...ttsSettings()};const id=e.target.id;if(id==='ttsVoice')t.voice=e.target.value;else if(id==='ttsArabicVoice')t.arabicVoice=e.target.value;else if(id==='ttsRate'){t.rate=Number(e.target.value);$('#ttsRateValue').textContent=t.rate.toFixed(2)+'×';}else if(id==='ttsPitch'){t.pitch=Number(e.target.value);$('#ttsPitchValue').textContent=t.pitch.toFixed(2);}else if(id==='ttsArabic')t.arabic=e.target.value;else if(id==='ttsAnnounce')t.announce=e.target.checked;else return;state.tts=t;save();}

// Test bitmeden yalnız bu sorunun cevabına bakılır. İlk bakıştaki cevap YZ analizi için ayrıca saklanır.
function peekOpen(s,q){return !!s.peeks?.[q.id]?.open;}
function togglePeek(){if(locked||currentState.checked)return;pulse();const s=currentState,q=currentTest.questions[s.index],a=s.answers[q.id]||null;const p=s.peeks[q.id];if(p?.open){p.open=false;showSolution=false;}else{if(!q.answer){toast('Bu sorunun cevap anahtarı yok; tek başına kontrol edilemez.');return;}const tryRec={at:new Date().toISOString(),answer:a,correct:a?a===q.answer:null};if(p){p.open=true;p.tries=[...(p.tries||[]),tryRec].slice(-20);}else s.peeks[q.id]={...tryRec,open:true,tries:[tryRec]};}save();render();}
function peekResultHTML(s,q){const a=s.answers[q.id];if(!q.answer)return '';const ok=a&&a===q.answer;return `<div class="peek-result ${a?ok?'good':'bad':'neutral'}" role="status">${a?ok?'✓ Doğru! Bu soruyu doğru cevapladın.':'✗ Yanlış. Senin cevabın '+esc(a)+', doğru cevap '+esc(q.answer)+'.':'Bu soruyu boş bıraktın. Doğru cevap '+esc(q.answer)+'.'}<button class="small" data-act="solution">${showSolution?'Açıklamayı gizle':'Kitap açıklamasını göster'}</button></div>`;}

// Uygulama yapay zekâ değildir; seçilen profilin çözümlerini, şık tanılarıyla birlikte bir dış YZ'ye verilecek pakete çevirir.

function touchedTest(s){return !!s&&(Object.keys(s.answers||{}).length>0||Object.values(s.notes||{}).some(x=>String(x).trim())||(s.history||[]).length>0||Object.keys(s.peeks||{}).length>0);}
function analysisPackage(scope){const p=activeProfile(),out={format:'test-atolyesi-analysis',version:1,generatedAt:new Date().toISOString(),readFirst:'ÖNCE readFirstGuide alanını oku. Sonra books[].meta (kitabın amacı/kapsamı), ardından tests[].questions[] içindeki userAnswer, result, options[userAnswer].diagnosis, note ve singleCheck alanlarını değerlendir.',readFirstGuide:aiGuideText(),app:{name:'Test Atölyesi',schema:'importContract (HTML başında) + bu paket'},profile:{name:p.name},summary:{tests:0,answered:0,correct:0,wrong:0,blank:0,notes:0,singleChecks:0},books:[]};
 for(const b of books){if(scope&&scope!==b.id)continue;const tests=[];for(const t of b.tests){const s=state.tests[b.id+'/'+t.id];if(!touchedTest(s))continue;const qs=t.questions.map((q,i)=>{const st=splitStem(q),a=s.answers[q.id]||null,pk=s.peeks?.[q.id],note=String(s.notes?.[q.id]||'').trim(),result=!q.answer?'anahtar-yok':!a?'boş':a===q.answer?'doğru':'yanlış';if(a)out.summary.answered++;if(result==='doğru')out.summary.correct++;else if(result==='yanlış')out.summary.wrong++;else if(result==='boş')out.summary.blank++;if(note)out.summary.notes++;if(pk)out.summary.singleChecks++;const rec={id:q.id,number:q.number||i+1,topic:q.topic,concepts:q.concepts,level:q.level,stem:st.stem,context:st.context||undefined,passage:q.passage||undefined,tables:q.blocks?.length?blocksSpeech(q.blocks):undefined,figures:(q.figures||[]).map(f=>f.alt).filter(Boolean),options:Object.fromEntries(q.options.map((o,j)=>[optionKey(o,j),{text:optionText(o),diagnosis:o.diagnosis||undefined}])),answer:q.answer??null,userAnswer:a,result,timeSec:Math.round(s.times?.[q.id]||0),flaggedForLater:!!s.flags?.[q.id],note:note||undefined,singleCheck:pk?{firstAt:pk.at,answerAtFirstCheck:pk.answer,correctAtFirstCheck:pk.correct,checks:(pk.tries||[]).length}:undefined,keyEditedByUser:Object.hasOwn(s.keyOverrides||{},q.id)||undefined,keyDoubt:q.keyDoubt||undefined,bookExplanation:q.explanation||undefined};if(!rec.figures.length)delete rec.figures;return rec;});out.summary.tests++;tests.push({id:t.id,title:t.title,section:t.section,topic:t.topic,checked:!!s.checked,elapsedSec:Math.round(s.elapsed||0),limits:{testSec:s.limit||0,questionSec:s.qLimit||0},result:s.checked?counts(t,s):null,attempts:(s.history||[]).map(h=>({at:h.at,correct:h.correct,wrong:h.wrong,blank:h.blank,elapsedSec:Math.round(h.elapsed||0),answers:h.answers})),questions:qs});}
  if(tests.length)out.books.push({id:b.id,title:b.title,author:b.author,year:b.year,description:b.description,meta:b.meta,testsInBook:b.tests.length,questionsInBook:b.tests.reduce((n,t)=>n+t.questions.length,0),sections:[...new Set(b.tests.map(t=>t.section).filter(Boolean))],tests});}
 const topics=new Map();for(const b of out.books)for(const t of b.tests)for(const q of t.questions){if(q.result==='anahtar-yok')continue;const k=b.title+' › '+(q.topic||t.topic||t.section||'Konu belirtilmemiş');const r=topics.get(k)||{topic:k,questions:0,correct:0,wrong:0,blank:0};r.questions++;if(q.result==='doğru')r.correct++;else if(q.result==='yanlış')r.wrong++;else r.blank++;topics.set(k,r);}
 out.summary.topics=[...topics.values()].sort((x,y)=>y.wrong-x.wrong||y.blank-x.blank);out.summary.note='summary.topics yalnız ham sayımdır; yorum için soru düzeyindeki şık tanılarını ve notları kullan.';
 return out;}

const cloudReady=()=>!!CLOUD_CFG.clientId&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname));
let cloud={token:'',exp:0,status:'off',err:'',lastSync:0,busy:false,dirtyAt:0,lastUploaded:'',timer:null,tokenClient:null,gis:null};
const cloudMeta=(()=>{try{return JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}')||{};}catch(e){return{};}})();

function cloudLabel(){if(!cloudReady()||!cloudMeta.enabled)return '';return{ok:' · Drive ✓',syncing:' · Drive eşitleniyor…',login:' · Drive: yeniden bağlan',error:' · Drive hatası',signing:' · Drive bağlanıyor…'}[cloud.status]||' · Drive';}
function cloudSet(status,err=''){cloud.status=status;cloud.err=err;updateSaveStatus();if($('#cloudPanel'))$('#cloudPanel').outerHTML=cloudPanelHTML();}
function loadGIS(){if(cloud.gis)return cloud.gis;cloud.gis=new Promise((res,rej)=>{if(window.google?.accounts?.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>{cloud.gis=null;rej(Error('Google giriş betiği yüklenemedi (internet?)'));};document.head.append(s);});return cloud.gis;}
async function cloudToken(interactive){if(cloud.token&&Date.now()<cloud.exp-60000)return cloud.token;await loadGIS();return new Promise((res,rej)=>{cloud.tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLOUD_CFG.clientId,scope:'https://www.googleapis.com/auth/drive.file',login_hint:cloudMeta.email||undefined,callback:r=>{if(r.error)return rej(Error(r.error_description||r.error));cloud.token=r.access_token;cloud.exp=Date.now()+(Number(r.expires_in)||3600)*1000;res(cloud.token);},error_callback:e=>rej(Error(e?.message||e?.type||'Giriş penceresi kapandı'))});cloud.tokenClient.requestAccessToken({prompt:interactive&&!cloudMeta.enabled?'consent':''});});}
async function gapi(url,opt={},retry=true){const tok=await cloudToken(false);const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+tok}});if(r.status===401&&retry){cloud.token='';return gapi(url,opt,false);}if(!r.ok)throw Error('Drive '+r.status+': '+(await r.text()).slice(0,160));return r;}
const enc=s=>encodeURIComponent(s);
async function cloudFind(query){const r=await gapi(DRIVE+'/files?spaces=drive&fields=files(id,name,modifiedTime,appProperties)&pageSize=100&q='+enc(query+' and trashed=false'));return (await r.json()).files||[];}
async function cloudFolder(){if(cloudMeta.folderId){try{const r=await gapi(DRIVE+'/files/'+cloudMeta.folderId+'?fields=id,trashed');const f=await r.json();if(!f.trashed)return f.id;}catch(e){}}const found=await cloudFind(`mimeType='application/vnd.google-apps.folder' and name='${CLOUD_FOLDER}'`);let id=found[0]?.id;if(!id){const r=await gapi(DRIVE+'/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:CLOUD_FOLDER,mimeType:'application/vnd.google-apps.folder'})});id=(await r.json()).id;}cloudMeta.folderId=id;cloudSaveMeta();return id;}
async function cloudWrite(fileId,name,folder,text,props){if(fileId){await gapi(UPLOAD+'/files/'+fileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json; charset=UTF-8'},body:text});return fileId;}const b='ta'+Math.random().toString(36).slice(2),meta={name,parents:[folder],mimeType:'application/json',appProperties:props||{}};const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${text}\r\n--${b}--`;const r=await gapi(UPLOAD+'/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});return (await r.json()).id;}
async function cloudRead(id){return (await gapi(DRIVE+'/files/'+id+'?alt=media')).text();}
function adoptStore(merged){const active=store.active;store=merged;if(store.profiles.some(p=>p.id===active))store.active=active;state=activeProfile().state;lastLocalSnapshot='';applyKeyOverrides();if(view==='study'&&currentBook&&currentTest)currentState=getState(currentBook,currentTest);}
async function cloudSync(interactive=false){if(!cloudReady()||locked||cloud.busy)return;cloud.busy=true;cloudSet(cloud.token?'syncing':'signing');try{await cloudToken(interactive);if(!cloudMeta.email){try{const r=await gapi(DRIVE+'/about?fields=user(emailAddress)');cloudMeta.email=(await r.json()).user?.emailAddress||'';}catch(e){}}cloudMeta.enabled=true;cloudSaveMeta();cloudSet('syncing');const folder=await cloudFolder();
  // Profiller: Drive'daki sürümle birleştir, sonucu geri yaz.
  pulse();save();const sf=(await cloudFind(`name='${CLOUD_STORE}' and '${folder}' in parents`))[0];let remote=null;if(sf){try{remote=normalizeStore(JSON.parse(await cloudRead(sf.id)));}catch(e){remote=null;}}const merged=remote?mergeStores(store,remote):store;const before=JSON.stringify(store);if(JSON.stringify(merged)!==before){adoptStore(merged);save();render();}const text=JSON.stringify(store);if(!remote||text!==JSON.stringify(remote))cloudMeta.storeId=await cloudWrite(sf?.id,CLOUD_STORE,folder,text);else cloudMeta.storeId=sf.id;cloud.lastUploaded=text;
  // Kitaplar: eksik olanı indir, Drive'da olmayanı yükle.
  const remoteBooks=await cloudFind(`'${folder}' in parents and appProperties has { key='kind' and value='book' }`);let changed=false;for(const f of remoteBooks){const id=f.appProperties?.bookId,ver=Number(f.appProperties?.contentVersion||0);const local=books.find(b=>b.id===id);if(local&&Number(local.contentVersion||0)>=ver)continue;try{const data=JSON.parse(await cloudRead(f.id));const b=validateBook(data.format==='test-atolyesi'?data.books[0]:data);await idb('put',b.id,b);imported=imported.filter(x=>x.id!==b.id);imported.push(b);changed=true;}catch(e){toast('Drive’daki kitap okunamadı: '+(f.name||'')+' · '+e.message);}}if(changed){books=[...baseBooks(),...imported.filter(b=>b.id!==builtin?.id)];applyKeyOverrides();if(!bookId)bookId=books[0]?.id;render();}
  for(const b of books){if(remoteBooks.some(f=>f.appProperties?.bookId===b.id&&Number(f.appProperties?.contentVersion||0)>=Number(b.contentVersion||0)))continue;const old=remoteBooks.find(f=>f.appProperties?.bookId===b.id);await cloudWrite(old?.id,'kitap-'+b.id+'.json',folder,JSON.stringify({format:'test-atolyesi',version:1,books:[b]}),{kind:'book',bookId:b.id,contentVersion:String(b.contentVersion||0)});if(old)await gapi(DRIVE+'/files/'+old.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({appProperties:{kind:'book',bookId:b.id,contentVersion:String(b.contentVersion||0)}})});}
  cloudSaveMeta();cloud.lastSync=Date.now();cloud.dirtyAt=0;cloudSet('ok');}catch(e){const m=String(e.message||e);cloudSet(/popup|consent|interaction|closed|denied|access_denied|login/i.test(m)?'login':'error',m);}finally{cloud.busy=false;}}
// Sık kaydetme (süre her saniye işler) Drive'ı yormasın: değişiklik varsa en geç 15 sn'de bir yükle.
async function cloudPush(){cloud.timer=null;if(!cloudMeta.enabled||!cloud.token||cloud.busy||locked)return;const text=JSON.stringify(store);if(text===cloud.lastUploaded)return;cloud.busy=true;try{const folder=await cloudFolder();cloudMeta.storeId=await cloudWrite(cloudMeta.storeId,CLOUD_STORE,folder,text);cloudSaveMeta();cloud.lastUploaded=text;cloud.lastSync=Date.now();cloudSet('ok');}catch(e){cloudSet('error',String(e.message||e));}finally{cloud.busy=false;}}

if(location.protocol==='https:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const act=el.dataset.act;const allowed=['nav','menu','contents','book','test','resume','backup','exportBackup','portable','htmlFile','close','prompt','format','history','zoomQ','zoomSolution','solution','figure','takeover','tts','ttsSettings','ttsTest','analysis','exportAnalysis','copyAiPrompt','aiGuide'];if(locked&&!allowed.includes(act)){toast('Önce bu sekmede devam etmeyi seç.');return;}const s=currentState,q=view==='study'?currentTest.questions[s.index]:null;switch(act){case'cloud':cloudDialog();break;case'cloudIn':await cloudSync(true);break;case'cloudSync':await cloudSync(false);break;case'cloudOut':await cloudSignOut();break;case'profiles':profileDialog();break;case'switchProfile':switchProfile(el.dataset.id);break;case'renameProfile':renameProfileDialog(el.dataset.id);break;case'deleteProfile':deleteProfile(el.dataset.id);break;case'addProfile':addProfile();break;case'tts':ttsRun(el.dataset.tts);break;case'ttsSettings':ttsDialog();break;case'ttsTest':ttsToggle('test:',()=>speechChunks('Merhaba. Bu, Test Atölyesi sesli okuma denemesidir. Okuma hızı '+ttsSettings().rate.toFixed(2).replace('.',',')+'.'));break;case'peek':togglePeek();break;case'analysis':analysisDialog();break;case'exportAnalysis':{pulse();save();const scope=$('#analysisScope')?.value||'',pkg=analysisPackage(scope);if(!pkg.books.length){toast('Bu kapsamda çözülmüş test yok.');break;}download('Test-Atolyesi-YZ-analiz-'+activeProfile().name.replace(/[^\p{L}\p{N}]+/gu,'-')+'-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(pkg,null,1));toast('Analiz paketi indirildi. Şimdi istem metnini kopyalayıp yapay zekâya ver.');}break;case'copyAiPrompt':{const txt=aiPromptText(activeProfile().name);try{await navigator.clipboard.writeText(txt);toast('İstem metni panoya kopyalandı.');}catch(err){dialog('İstem metni',`<textarea rows="8" readonly>${esc(txt)}</textarea><p class="file-help">Metni seçip kopyala.</p>`);}}break;case'aiGuide':download('Test-Atolyesi-YZ-analiz-yonergesi.md',aiGuideText(),'text/markdown;charset=utf-8');break;case'htmlFile':htmlFileDialog();break;case'chooseHTML':await chooseHTMLFile();break;case'resumeHTML':await resumeHTMLFile();break;case'disconnectHTML':await disconnectHTMLFile();break;case'appearance':appearanceDialog();break;case'resetAppearance':state.appearance=normalizeAppearance({});applyAppearance();save();appearanceDialog();break;case'figure':{const figures=el.dataset.kind==='question'?q.figures:q.explanationFigures;const f=figures?.[Number(el.dataset.index)];if(f){dialog(f.alt||'Kitaptaki şekil',`<img src="${f.src}" alt="${esc(f.alt||'Kitaptaki şekil')}">`);$('#modal .dialog').classList.add('image-view');}}break;case'nav':nav(el.dataset.view);break;case'menu':$('#sidebar').classList.toggle('open');break;case'contents':openBook(bookId);break;case'book':openBook(el.dataset.id);break;case'test':openTest(el.dataset.book,el.dataset.test);break;case'resume':resume();break;case'pause':toggleRun();break;case'prev':jump(s.index-1);break;case'next':jump(s.index+1);break;case'jump':jump(Number(el.dataset.index));break;case'answer':answer(el.dataset.id);break;case'clearAnswer':delete s.answers[q.id];save();render();break;case'flag':s.flags[q.id]=!s.flags[q.id];save();render();break;case'check':check();break;case'uncheck':s.checked=false;showSolution=false;save();render();break;case'solution':showSolution=!showSolution;render();break;case'settings':settings();break;case'resetQuestionTime':confirmAction('Soru süresini sıfırla','Yalnız bu sorunun süresi sıfırlanır. Testin toplam çalışma süresi korunur.',()=>{s.times[q.id]=0;});break;case'resetTestTime':confirmAction('Test sürelerini sıfırla','Bu testin toplam ve soru bazlı tüm süreleri sıfırlanır. Seçimlerin ve notların korunur.',()=>{s.elapsed=0;s.times={};});break;case'clearTestAnswers':confirmAction('Tüm seçimleri sil','Bu testteki tüm cevap seçimleri silinir. Süreler, notlar ve kontrol geçmişi korunur.',()=>{s.answers={};s.checked=false;showSolution=false;});break;case'resetTest':confirmAction('Testi tamamen sıfırla','Bu testin seçimleri, süreleri, notları, işaretleri, sınırları ve kontrol geçmişi silinecek. Cevap anahtarı düzeltmeleri korunacak.',()=>{const keys=s.keyOverrides||{};delete state.tests[currentBook.id+'/'+currentTest.id];currentState=getState(currentBook,currentTest);currentState.keyOverrides=keys;showSolution=false;});break;case'close':closeDialog();break;case'backup':backupDialog();break;case'exportBackup':pulse();save();download('Test-Atolyesi-yedek-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'test-atolyesi-backup',version:2,createdAt:new Date().toISOString(),store,books:imported}));toast('Yedek indirildi.');break;case'restore':inputMode='backup';$('#file').click();break;case'import':inputMode='book';$('#file').click();break;case'portable':await portable();break;case'prompt':download('AI-kitap-donusturme-yonergesi.txt',prompt,'text/plain;charset=utf-8');break;case'format':download('Test-Atolyesi-format-ornegi.json',JSON.stringify(sample,null,2));break;case'history':dialog('Kontrol geçmişi',s.history.length?s.history.slice().reverse().map(h=>`<p><b>${esc(new Date(h.at).toLocaleString('tr-TR'))}</b><br>${h.correct} doğru · ${h.wrong} yanlış · ${h.blank} boş · ${duration(h.elapsed)}</p>`).join(''):'<p>Bu test henüz kontrol edilmedi.</p>');break;case'zoomQ':case'zoomSolution':dialog(act==='zoomQ'?'Soru görüntüsü':'Kitaptaki çözüm',`<img src="${act==='zoomQ'?q.image:q.explanationImage}" alt="Büyük görüntü">`);$('#modal .dialog').classList.add('image-view');break;case'editKey':dialog('Cevap anahtarını düzelt','<p>Kitabın kaynak çözümünü inceledikten sonra doğru harfi seç. Bu değişiklik kişisel kaydına işlenir.</p><select id="keyAnswer"><option value="">Anahtar bilinmiyor</option>'+q.options.map((o,i)=>{const k=String.fromCharCode(65+i);return `<option ${q.answer===k?'selected':''}>${k}</option>`;}).join('')+'</select>','<button class="primary" id="saveKey">Kaydet</button>');$('#saveKey').onclick=()=>{rememberKey(q);q.answer=$('#keyAnswer').value||null;s.keyOverrides=s.keyOverrides||{};s.keyOverrides[q.id]=q.answer;save();closeDialog();render();};break;case'removeBook':confirmAction('Kitabı kaldır','Bu ek kitap ve ona ait çalışma kayıtları bu tarayıcıdan silinecek. Önce yedek alabilirsin.',async()=>{try{await idb('delete',el.dataset.id);imported=imported.filter(b=>b.id!==el.dataset.id);books=[...baseBooks(),...imported];for(const k of Object.keys(state.tests))if(k.startsWith(el.dataset.id+'/'))delete state.tests[k];if(state.last?.book===el.dataset.id)state.last=null;bookId=books[0]?.id||null;save();render();}catch(e){toast('Kitap kaldırılamadı.');}});break;case'takeover':claim(true);try{const latest=normalizeStore(JSON.parse(localStorage.getItem(STORE_KEY)||'null'));if(latest){store=latest;state=activeProfile().state;}}catch(e){}if(view==='study')currentState=getState(currentBook,currentTest);applyKeyOverrides();render();toast('Çalışma bu sekmeye alındı.');break;}});
document.addEventListener('input',e=>{if(['ttsRate','ttsPitch'].includes(e.target.id)){if(!locked)ttsInput(e);return;}if(['fontSize','lineHeight','backgroundColor','paperColor','textColor','accentColor'].includes(e.target.id)){if(!locked)appearanceInput(e);return;}if(e.target.id==='search'){filter=e.target.value;$('#testList').innerHTML=testCards(books.find(b=>b.id===bookId)||books[0]);}if(e.target.id==='qNote'&&!locked){currentState.notes[currentTest.questions[currentState.index].id]=e.target.value;save();}});
document.addEventListener('change',e=>{if(['ttsVoice','ttsArabicVoice','ttsArabic','ttsAnnounce'].includes(e.target.id)){if(!locked)ttsInput(e);return;}if(['themeChoice','readingFont'].includes(e.target.id)){if(!locked)appearanceInput(e);return;}if(e.target.id==='sectionFilter'){sectionFilter=e.target.value;$('#testList').innerHTML=testCards(books.find(b=>b.id===bookId)||books[0]);}if(e.target.id==='file'){if(e.target.files[0])importFile(e.target.files[0]);e.target.value='';}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();$('#sidebar')?.classList.remove('open');return;}if(view!=='study'||$('#modal').children.length||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight'){e.preventDefault();jump(currentState.index+1);}else if(e.key==='ArrowLeft'){e.preventDefault();jump(currentState.index-1);}else if(e.code==='Space'){e.preventDefault();toggleRun();}else if(e.key==='k'||e.key==='K'){e.preventDefault();togglePeek();}else if(e.key==='r'||e.key==='R'){e.preventDefault();if(!currentTest.questions[currentState.index].image)ttsRun('q');}else if(/^[1-8]$/.test(e.key)){const i=Number(e.key)-1;if(i<currentTest.questions[currentState.index].options.length)answer(String.fromCharCode(65+i));}});
window.addEventListener('beforeunload',()=>{pulse();save();try{if(!locked){const owner=JSON.parse(localStorage.getItem(LOCK)||'null');if(owner?.id===tabId)localStorage.removeItem(LOCK);}}catch(e){}});
document.addEventListener('visibilitychange',()=>{pulse();if(document.hidden){running=false;save();if(view==='study')render();}});
window.addEventListener('storage',e=>{if(e.key===LOCK){try{const o=JSON.parse(e.newValue||'null');if(o&&o.id!==tabId&&Date.now()-o.at<6500&&!locked){pulse();running=false;locked=true;render();}}catch(err){}}});
setInterval(()=>{pulse();if(ready&&!locked){claim();save();}},1000);
render();init();
</script>
</body></html>
